server:
  port: 8082
  servlet:
    context-path: /identity

spring:
  application:
    name: identity

  # Virtual Threads (Java 21+)
  threads:
    virtual:
      enabled: true

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/identity
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: HikariCP-Identity
      connection-test-query: SELECT 1
      connection-init-sql: SET NAMES 'utf8'
      read-only: false
      auto-commit: true
      transaction-isolation: TRANSACTION_READ_COMMITTED
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        elideSetAutoCommits: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        alwaysSendSetIsolation: false
        useLocalTransactionState: true
        useUnicode: true
        characterEncoding: UTF-8
        serverTimezone: UTC
        useSSL: false
        socketTimeout: 30000
        connectTimeout: 30000
        idleTimeout: 30000
        maxLifetime: 1800000
        connectionTimeout: 20000
        connectionTestQuery: SELECT 1
        connectionInitSql: SET NAMES 'utf8'
        connectionInitAction: SET TIME ZONE 'UTC'
        sslMode: DISABLE

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        types:
          json:
            json_format: jsonb

  # Liquibase
  liquibase:
    enabled: true
    change-log: classpath:/db/db.changelog-master.yaml
    default-schema: public
    liquibase-schema: public

  # Jackson JSON Configuration
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:8081}

# JWT Configuration (RSA signing - no secret needed)
jwt:
  # Issuer must match the identity service URL (used by resource servers to validate tokens)
  issuer: ${JWT_ISSUER:http://localhost:8082/identity}
  audience: ${JWT_AUDIENCE:ofa-pms}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
  key-encryption:
    # Secret for encrypting private keys at rest (min 32 chars in production)
    secret: ${JWT_KEY_ENCRYPTION_SECRET:change-this-in-production-min-32-chars}

# OAuth2 Configuration
identity:
  oauth2:
    issuer-uri: ${IDENTITY_ISSUER_URI:http://localhost:8082/identity}
    jwks-uri: /.well-known/jwks.json

# Springdoc OpenAPI Configuration
#springdoc:
#  api-docs:
#    path: /api-docs
#  swagger-ui:
#    path: /swagger-ui.html
#    enabled: true

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

# Logging Configuration
app:
  couchdb:
    url: ${COUCHDB_URL:http://localhost:5984}
    connect-timeout: ${COUCHDB_CONNECT_TIMEOUT:5s}
    read-timeout: ${COUCHDB_READ_TIMEOUT:30s}
    proxy-auth:
      username: ${COUCHDB_PROXY_AUTH_USERNAME:admin}
      roles: ${COUCHDB_PROXY_AUTH_ROLES:_admin}
      secret: ${COUCHDB_PROXY_AUTH_SECRET:change-me}
      algorithm: ${COUCHDB_PROXY_AUTH_ALGORITHM:HmacSHA1}
      encoding: ${COUCHDB_PROXY_AUTH_ENCODING:UTF-8}

logging:
  level:
    com.primetech.poc.identity: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
